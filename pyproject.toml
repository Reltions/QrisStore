[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chem-agent"
version = "0.1.0"
description = "A Claude-powered chemistry research agent: literature search, compound lookup, cheminformatics and reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8",
    "rdkit>=2024.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chem-agent = "chem_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
